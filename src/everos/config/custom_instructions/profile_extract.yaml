# Custom instructions for profile extraction (``ProfileExtractor.aextract``).
#
# What it does
#   When enabled, ``instructions`` is appended verbatim after the
#   operator's bundled rules as its ``custom_instructions`` block. It adds
#   requirements; it cannot replace a bundled rule or change the output shape.
#   The text is never rendered as a template, so braces stay literal.
#
# To use it
#   1. Write the requirement below, e.g.
#        instructions: "Record the user's preferred programming languages under the category 'tools'."
#   2. Flip ``enabled`` to ``true``.
#
# Disabled, or with blank ``instructions``, the operator runs on its own rules.

enabled: true
instructions: >-
  Describe accounts, services and credentials in words only, for example
  "has a Proton Mail account" or "holds a voucher for the print shop": leave
  out email addresses, phone numbers, account, order and tracking ids,
  voucher, OTP and verification codes, passwords, API keys and tokens.
  When the conversation corrects or contradicts a stored item, update that
  item to the corrected fact, or delete it when it no longer holds.
